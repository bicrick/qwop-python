---
seed: 7
run_id: scout-extknee-s1
model_load_file: ~
out_dir_template: "data/scout/{run_id}"
log_tensorboard: true
total_timesteps: 400_000
max_episode_steps: 800
n_checkpoints: 8
n_envs: 2
learner_kwargs:
  policy: "MlpPolicy"
  buffer_size: 50000
  learning_starts: 5000
  batch_size: 64
  tau: 1.0
  gamma: 0.997
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 512
  exploration_fraction: 0.4
  exploration_initial_eps: 0.3
  exploration_final_eps: 0.05
learner_lr_schedule: "const_0.001"
env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true
  success_reward: 50.0
env_wrappers:
  - module: "qwop_python.wrappers.anti_scrape_wrapper"
    cls: "AntiScrapeCurriculumWrapper"
    kwargs:
      velocity_weight: 0.45
      height_weight: 0.35
      height_floor: 1.25
      scrape_weight: 0.7
      scrape_torso_max_height: 1.0
      scrape_flexion_min: 0.45
      knee_flex_weight: 0.0
      knee_extension_bonus_weight: 0.25
      anneal_penalties: true
      initial_scrape_weight: 0.7
      final_scrape_weight: 0.2
      initial_height_weight: 0.35
      final_height_weight: 0.15
      anneal_hold_fraction: 0.2
      anneal_ramp_fraction: 0.9
