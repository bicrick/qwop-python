---
# Settle-aware START adapter. Continue finish-leader early1 zip.
# ONE new knob: StartPaceWrapper (dense progress <10m + fast-split bonus +
# early-fall cost). settle_spawn MUST stay true — settle-OFF starts are fake-fast.
# Spectate gate: only promote if browser t_0_10 / finish improve (not Python user/time).
# Not expert. No speed_rew mid-race.

seed: ~
run_id: ~

model_load_file: data/models/continue.zip

out_dir_template: "data/PPO-kurodo-gait-{run_id}"
log_tensorboard: true

total_timesteps: 8_000_000
max_episode_steps: 2000
n_checkpoints: 8

n_envs: 4

learner_kwargs:
  policy: "MlpPolicy"
  use_sde: false
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  normalize_advantage: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

learner_lr_schedule: "const_0.0003"

env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 2
  reduced_action_set: false
  speed_rew_mult: 0.0
  settle_spawn: true
  settle_max_steps: 20

env_wrappers:
  - module: "qwop_python.wrappers.flex_gait_wrapper"
    cls: "FlexibleGaitImitationWrapper"
    kwargs:
      hold_bonus: 0.04
      soft_hold_scale: 0.55
      switch_bonus: 0.12
      upright_min_height: 1.15
      ideal_half_s: 0.65
      hold_full_s: 0.40
      switch_lo_s: 0.28
      switch_hi_s: 0.85
      late_ok_s: 1.25
      none_grace_s: 0.22
      none_reset_s: 0.45
      both_thigh_penalty: 0.03
      same_dir_penalty: 0.02
      same_dir_after_s: 0.55
      scrape_weight: 0.12
  - module: "qwop_python.wrappers.start_pace_wrapper"
    cls: "StartPaceWrapper"
    kwargs:
      focus_m: 10.0
      progress_mult: 4.0
      split_ref_s: 12.0
      split_bonus_scale: 1.5
      early_fail_cost: 10.0
      post_focus_progress_mult: 0.0
