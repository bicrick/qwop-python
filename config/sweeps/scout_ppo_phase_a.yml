---
# Scout: Phase A — competence first (finish/stay upright), no speed incentives.
seed: ~
run_id: ~
model_load_file: ~
out_dir_template: "data/scout-ppo-phase-a-{run_id}"
log_tensorboard: true
total_timesteps: 200_000
max_episode_steps: 2000
n_checkpoints: 2
n_envs: 1

learner_kwargs:
  policy: "MlpPolicy"
  use_sde: false
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.98
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

learner_lr_schedule: "const_0.0003"

env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true
  # Keep failure cost so falling is punished early
  failure_cost: 10
  success_reward: 50
  speed_rew_mult: 0.05

env_wrappers: []
