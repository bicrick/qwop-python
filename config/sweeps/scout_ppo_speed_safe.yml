---
# Scout: Speed-safe — mild progressive velocity incentive after competence.
seed: ~
run_id: ~
model_load_file: ~
out_dir_template: "data/scout-ppo-speed-safe-{run_id}"
log_tensorboard: true
total_timesteps: 200_000
max_episode_steps: 2000
n_checkpoints: 2
n_envs: 1

learner_kwargs:
  policy: "MlpPolicy"
  use_sde: false
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.98
  clip_range: 0.2
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5

learner_lr_schedule: "const_0.0003"

env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true
  failure_cost: 5
  speed_rew_mult: 0.2

env_wrappers:
  - module: "qwop_python.wrappers.reward_shaping_wrapper"
    cls: "ProgressiveVelocityIncentiveWrapper"
    kwargs:
      initial_velocity_weight: 0.2
      final_velocity_weight: 1.0
      initial_exponent: 1.2
      final_exponent: 2.0
      ramp_fraction: 0.6
      hold_fraction: 0.2
