---
# Watch gait-a checkpoint (4M steps) from the flying GCP run.
# Trained with full 16-action set and frames_per_step 4. PPO, not QRDQN.
fps: 30
reset_delay: 1
model_file: "data/saved_models/kurodo_gait_a_4m.zip"
model_mod: "stable_baselines3"
model_cls: "PPO"
steps_per_step: 1
env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  render_mode: "human"
  reduced_action_set: false
env_wrappers: []
