# config/evaluate.yml — also available as config/eval_wr.yml for WR runs
model_file: "data/PPO-*/model.zip"
model_mod: "stable_baselines3"
model_cls: "PPO"
n_episodes: 20
seed: 42
deterministic: true
render: false
max_episode_steps: 1000
human_wr_seconds: 45.530
finish_distance_m: 100.0
out_json: ~

env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true

env_wrappers: []
