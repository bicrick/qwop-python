---
# Start from expert_dqnfd (~55.6s HUD, high finish rate). Tiny LR + low explore.
seed: 7
run_id: scout-from-expert-s1
model_load_file: "data/saved_models/expert_dqnfd.zip"
out_dir_template: "data/scout/{run_id}"
log_tensorboard: true
total_timesteps: 1_000_000
max_episode_steps: 2000
n_checkpoints: 20
n_envs: 2
learner_kwargs:
  policy: "MlpPolicy"
  buffer_size: 100000
  learning_starts: 2000
  batch_size: 64
  tau: 1.0
  gamma: 0.997
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 512
  exploration_fraction: 0.2
  exploration_initial_eps: 0.05
  exploration_final_eps: 0.02
learner_lr_schedule: "const_0.00005"
env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true
  success_reward: 100.0
  failure_cost: 25.0
  time_cost_mult: 10.0
  distance_rew_mult: 8.0
  speed_rew_mult: 0.25
env_wrappers:
  - module: "qwop_python.wrappers.anti_scrape_wrapper"
    cls: "AntiScrapeCurriculumWrapper"
    kwargs:
      velocity_weight: 0.25
      height_weight: 0.2
      height_floor: 1.15
      scrape_weight: 0.5
      scrape_torso_max_height: 0.95
      scrape_flexion_min: 0.45
      knee_flex_weight: 0.02
      knee_extension_bonus_weight: 0.05
      anneal_penalties: false
  - module: "qwop_python.wrappers.stuck_detection_wrapper"
    cls: "StuckDetectionWrapper"
    kwargs:
      patience_steps: 120
      min_speed_mps: 0.1
