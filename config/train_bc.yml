---
# Behavioral cloning from .rec demonstrations (Liao-style demo bootstrap).
#
# Prerequisites:
#   1. qwop-python record_model   # writes data/recordings/*.rec
#   2. pip install "imitation>=1.0"  # optional; minimal BC fallback exists
#
#   qwop-python train_bc
#
# Outputs under data/BC-{run_id}/:
#   model.zip       — ActorCriticPolicy (spectate with model_cls: BC)
#   ppo_warmup.zip  — PPO zip for on-policy RL finetune via model_load_file
#
# Do NOT use expert_dqnfd.zip as WR QRDQN model_load_file. Expert is only for
# generating .rec demos. WR QRDQN scout / Phase A stay from-scratch.

seed: ~
run_id: ~

recordings:
  - "data/recordings/*.rec"

out_dir_template: "data/BC-{run_id}"
log_tensorboard: true

# Short default for smoke tests; raise for real bootstrap (e.g. 200–500).
n_epochs: 50

# Write ppo_warmup.zip for PPO finetune (optional).
save_ppo_warmup: true

# https://imitation.readthedocs.io/en/latest/algorithms/bc.html#api
learner_kwargs:
  batch_size: 32
  minibatch_size: ~
  ent_weight: 0.001
  l2_weight: 0.0

# Must match the env used when recording demos (record_model.yml).
env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true

env_wrappers: []
