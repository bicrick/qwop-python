---
# Headlessly roll out a saved SB3 model into data/recordings/*.rec
#
# Expert zip is for DEMO GENERATION ONLY — do NOT set it as model_load_file
# on WR QRDQN runs. See doc/DEMO_BOOTSTRAP.md.
#
#   qwop-python record_model
#   qwop-python -c config/record_model.yml record_model

seed: 42

model_file: "data/saved_models/expert_dqnfd.zip"
model_mod: "sb3_contrib"
model_cls: "QRDQN"

# How many headless episodes to attempt
n_episodes: 30
max_episode_steps: 2000
deterministic: true

# Env must match the model (expert_dqnfd uses reduced 9-action + fps=4).
env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true

env_wrappers:
  - module: "qwop_python"
    cls: "RecordWrapper"
    kwargs:
      # Timestamped name avoids clobbering; set overwrite true for iteration.
      rec_file: "data/recordings/expert_dqnfd_demos.rec"
      overwrite: true
      # Keep upright / far demos; loosen for short scouts.
      max_time: 120
      min_distance: 5
