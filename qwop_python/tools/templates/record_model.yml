# Headless model → .rec (same schema as play+RecordWrapper)
seed: 42
model_file: "data/saved_models/expert_dqnfd.zip"
model_mod: "sb3_contrib"
model_cls: "QRDQN"
n_episodes: 10
max_episode_steps: 2000
deterministic: true

env_kwargs:
  __include__: "config/env.yml"
  frames_per_step: 4
  reduced_action_set: true

env_wrappers:
  - module: "qwop_python"
    cls: "RecordWrapper"
    kwargs:
      rec_file: "data/recordings/expert_dqnfd_demos.rec"
      overwrite: true
      max_time: 120
      min_distance: 5
